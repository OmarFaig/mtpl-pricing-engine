[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtpl-pricing-engine"
version = "0.1.0"
description = "MTPL frequency/severity pricing engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "pandera>=0.19",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "mlflow>=2.12",
    "shap>=0.45",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "openml>=0.15",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
mtpl = "mtpl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mtpl", "api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["X", "X_*"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
disallow_untyped_defs = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "pyarrow.*",
    "sklearn.*",
    "statsmodels.*",
    "shap.*",
    "lightgbm.*",
    "optuna.*",
    "openml.*",
    "mlflow.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
